version: "2"
sql:
  - engine: postgresql
    schema: internal/database/migrations
    queries: internal/database/sql
    gen:
      go:
        package: dbgen
        out: internal/database/dbgen
        sql_package: pgx/v5
        emit_json_tags: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
